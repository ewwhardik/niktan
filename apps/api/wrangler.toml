name = "niktan-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "niktan"
database_id = "3a465492-0f83-4cab-a251-5bd37bd2f079"
migrations_dir = "migrations"

[vars]
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:5174,https://niktan.pages.dev,https://niktan.vercel.app"
DEMO_MODE = "true"
# Days to keep real screenings (simulated visits: 2 days, thali scans: 7, staff audit: 180).
RETENTION_DAYS = "30"

[triggers]
crons = ["30 0 * * *"]

# Secrets: STAFF_SECRET, GEMINI_API_KEY, GROQ_API_KEY
# Optional backup credentials: GEMINI_API_KEY_2, GROQ_API_KEY_2
# Optional Workers AI backup account: CLOUDFLARE_AI_BACKUP_ACCOUNT_ID, CLOUDFLARE_AI_BACKUP_TOKEN

[ai]
binding = "AI"
