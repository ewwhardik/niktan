name = "niktan-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "niktan"
# Replace with the id printed by `wrangler d1 create niktan`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:5174,https://niktan.pages.dev"
DEMO_MODE = "true"
# Days to keep real screenings (simulated visits: 2 days, thali scans: 7, staff audit: 180).
RETENTION_DAYS = "30"

[triggers]
crons = ["30 0 * * *"]

# Secrets (set with `wrangler secret put`): STAFF_SECRET, GEMINI_API_KEY, GROQ_API_KEY

# Optional Workers AI binding for a Cloudflare deployment:
# [ai]
# binding = "AI"
