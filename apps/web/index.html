<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#FBFAF7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F0F0E" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="NikTan: a 3-minute phone health check that gets you triaged before you reach the OPD." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/brand/niktan-mark.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/brand/app-180.png" />
    <style>
      body { margin:0; }
      #boot { position:fixed; inset:0; z-index:1000; transition:opacity .5s cubic-bezier(.22,1,.36,1), transform .6s cubic-bezier(.22,1,.36,1); }
      #boot.boot-out { opacity:0; transform:scale(1.04); pointer-events:none; }
      .brand-loader { min-height:100svh; display:grid; place-items:center; align-content:center; gap:18px; background:#f5f5f7; color:#00454c; }
      .nl { width:72px; height:68px; overflow:visible; animation:nl-beat 2.6s cubic-bezier(.22,1,.36,1) infinite; transform-origin:50% 60%; }
      .nl-trace { fill:none; stroke:currentColor; stroke-width:1.6; stroke-linejoin:round; stroke-dasharray:100; animation:nl-trace 2.6s cubic-bezier(.65,0,.35,1) infinite; }
      .nl-fill { fill:currentColor; transform:translateY(100%); animation:nl-fill 2.6s cubic-bezier(.65,0,.35,1) infinite; }
      .nl-pulse { fill:none; stroke:#ff3b30; stroke-width:2.6; stroke-linecap:round; stroke-dasharray:5 95; animation:nl-pulse 1.3s linear infinite; }
      .nl-word { font:600 15px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter Variable",system-ui,sans-serif; letter-spacing:-.01em; opacity:.55; }
      @keyframes nl-trace { 0% { stroke-dashoffset:100; opacity:1; } 45% { stroke-dashoffset:0; } 88% { opacity:1; } 100% { stroke-dashoffset:0; opacity:0; } }
      @keyframes nl-fill { 0%,30% { transform:translateY(100%); } 66% { transform:translateY(0); } 92% { transform:translateY(0); opacity:1; } 100% { transform:translateY(0); opacity:0; } }
      @keyframes nl-pulse { from { stroke-dashoffset:100; } to { stroke-dashoffset:0; } }
      @keyframes nl-beat { 0%,66% { transform:scale(1); } 72% { transform:scale(1.09); } 78% { transform:scale(.98); } 84% { transform:scale(1.04); } 92%,100% { transform:scale(1); } }
      @media (prefers-color-scheme:dark) { .brand-loader { background:#000; color:#f5f5f7; } }
      @media (prefers-reduced-motion:reduce) { .nl, .nl-trace, .nl-pulse { animation:none; } .nl-fill { animation:none; transform:none; } .nl-pulse { display:none; } }
    </style>
    <title>NikTan · निकतन</title>
  </head>

</html>
